<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE — Головна</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
      <span>PULSE</span>
    </a>
    <nav class="nav">
      <a href="index.html" class="active">Головна</a>
      <a href="listen.html">Альбом</a>
      <a href="ai-system.html">AI-студія</a>
      <a href="baraban.html">Ритм</a>
    </nav>
    <div class="search-profile">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Пошук треків..." />
      </div>
      <div class="profile-avatar"></div>
    </div>
  </header>

  <main class="container">
    <section class="home-hero">
      <p class="section-label"><i class="fa-solid fa-compact-disc"></i> ТВІЙ ПЛЕЙЛИСТ</p>
      <h1 id="greeting">Привіт!</h1>
      <p class="home-subtitle">Обери трек і почни слухати прямо зараз</p>
    </section>
    <div class="cards" id="cards"></div>
  </main>

  <div class="player-bar-container">
    <div class="player-bar compact">
      <div class="player-track-info">
        <div class="mini-cover" id="mini-cover"></div>
        <div>
          <h5 id="player-title">Обери трек</h5>
          <p id="player-artist">PULSE</p>
        </div>
      </div>
      <div class="player-controls">
        <button class="control-btn" onclick="prev()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause-circle" onclick="togglePlay()" id="play-btn">
          <i class="fa-solid fa-play" id="play-icon"></i>
        </button>
        <button class="control-btn" onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
